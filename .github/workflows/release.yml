name: Release

# 推送 v* tag 时自动创建 GitHub Release（正文取 docs/release-notes/<tag>.md 的首行作标题）；
# 若该 tag 的 Release 已存在（重新发版/补丁说明，或 tag 重建后 Release 变为 draft），则更新并发布。
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            TITLE=$(head -n 1 "$NOTES" | sed 's/^# //')
            tail -n +2 "$NOTES" > /tmp/notes.md
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md --draft=false
            else
              gh release create "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
            fi
          else
            gh release create "$TAG" --generate-notes
          fi
