# ============================================================
# 技能 -> 学习资源库（用于差距报告的学习建议，按优先级排序）
# ============================================================
version: 1

resources:
  - skill_id: PROG.PYTHON
    items:
      - {type: course, title: "Python 官方教程", url: "https://docs.python.org/zh-cn/3/tutorial/"}
      - {type: book, title: "流畅的 Python", url: ""}

  - skill_id: FRAMEWORK.PYTORCH
    items:
      - {type: course, title: "PyTorch 官方教程", url: "https://pytorch.org/tutorials/"}
      - {type: book, title: "动手学深度学习（PyTorch 版）", url: "https://zh.d2l.ai/"}

  - skill_id: ML.DL
    items:
      - {type: course, title: "吴恩达深度学习专项", url: "https://www.coursera.org/specializations/deep-learning"}
      - {type: book, title: "动手学深度学习", url: "https://zh.d2l.ai/"}

  - skill_id: ML.TRANSFORMER
    items:
      - {type: paper, title: "Attention Is All You Need", url: "https://arxiv.org/abs/1706.03762"}
      - {type: blog, title: "The Illustrated Transformer", url: "https://jalammar.github.io/illustrated-transformer/"}

  - skill_id: AITECH.DISTRIBUTED
    items:
      - {type: doc, title: "PyTorch DDP 文档", url: "https://pytorch.org/docs/stable/distributed.html"}
