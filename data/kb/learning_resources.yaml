      - {type: course, title: "Pandas 官方文档", url: "https://pandas.pydata.org/docs/"}

  - skill_id: ENGINEERING.DOCKER
    items:
      - {type: course, title: "Docker 官方入门", url: "https://docs.docker.com/get-started/"}

  - skill_id: ENGINEERING.LINUX
    items:
      - {type: course, title: "Linux 就该这么学", url: ""}

  - skill_id: ENGINEERING.GIT
    items:
      - {type: course, title: "Git 官方文档", url: "https://git-scm.com/doc"}
