# ============================================================
# 数据源配置：路径均相对于「项目根目录」
# 应对未知结构的 Kaggle/CSV：只需改 column_mapping 即可适配
# ============================================================
source:
  type: local_csv                # local_csv | kaggle | playwright
  path: data/raw/all_jobs.csv
  job_prefix: jd

column_mapping:
  job_id: job_id
  job_id_aliases: [id, jobid]
  company: company
  company_aliases: [org, company_name, employer]
  title: title
  title_aliases: [job_title, position, job_name]
  location: location
  location_aliases: [city, work_location, region]
  salary: salary
  salary_aliases: [salary_range, pay, compensation]
  experience: experience
  experience_aliases: [exp, work_years, seniority]
  education: education
  education_aliases: [degree, degree_requirement]
  jd_text: jd_text
  jd_text_aliases: [description, job_description, requirements, responsibilities, jd]

cleaning:
  min_jd_chars: 30
  normalize_company: true
  strip_html: true
  title_filter:
    enabled: true        # 剔除土建/施工等与 AI 岗位无关的标题（只按标题判，不看 JD 正文）
    # 留空则使用 src/data/job_filter.py 内置词表；可在此覆盖
    exclude_keywords: []
    keep_keywords: []

output:
  jobs_jsonl: data/processed/jobs.jsonl
  jobs_parquet: data/processed/jobs.parquet
  skills_csv: data/processed/skills_long.csv
  stats_path: data/processed/build_stats.json
  freshness_path: data/processed/job_freshness.json
