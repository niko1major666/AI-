name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # D7：词表/资源结构校验 + 语法编译检查（不依赖测试，先拦住坏数据）
      - name: Validate knowledge base
        run: python scripts/validate_kb.py

      - name: Compile check
        run: python -m compileall -q src scripts

      # D4/D5：快测；slow 标记（全语料遍历）留给 nightly
      # 覆盖率门槛只在 3.12 上跑：Python 3.10 的 coverage 用 sys.settrace 逐行追踪，
      # 会把 AppTest 首屏的纯 Python 全语料抽取（约 160 万次 re.finditer）放慢约 15 倍
      # （实测正则调用 5.8k/s vs 3.12 sys.monitoring 80k/s），首屏 14.5s 膨胀到 ~240s
      # 撞 AppTest 超时；3.12 用 PEP 669 sys.monitoring，只放大约 1.3 倍。
      # 3.10 仍然跑全量用例（含 AppTest），只是不开启覆盖率统计。
      - name: Run tests with coverage (3.12)
        if: matrix.python-version == '3.12'
        run: |
          set -o pipefail
          pytest -m "not slow" --cov=src --cov-report=term-missing --cov-fail-under=55 --tb=short 2>&1 | tee pytest.log

      - name: Run tests (3.10, no coverage)
        if: matrix.python-version == '3.10'
        run: |
          set -o pipefail
          pytest -m "not slow" --tb=short 2>&1 | tee pytest.log

      # 把失败用例写进 check-run 注解：无需 Actions 登录也能从 API 看到失败详情
      - name: Annotate failing tests
        if: failure()
        run: |
          {
            echo "### pytest 失败用例（Python ${{ matrix.python-version }}）"
            echo '```'
            grep -E "^(FAILED|ERROR) " pytest.log | head -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR) " pytest.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          grep -E "^E  " pytest.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=pytest-detail::$line"
          done

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest.log

  # D6：指标回归报告（只在 main 上跑，产物可下载）
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Regenerate docs/metrics.md
        run: python scripts/eval_all.py
      - name: Fail if metrics report is stale
        run: git diff --exit-code docs/metrics.md
      - name: Regenerate docs/source_health.md
        run: python scripts/source_health.py
      - name: Fail if source health report is stale
        run: git diff --exit-code docs/source_health.md
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: docs/metrics.md

