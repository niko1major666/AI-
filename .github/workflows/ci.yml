name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # D7：词表/资源结构校验 + 语法编译检查（不依赖测试，先拦住坏数据）
      - name: Validate knowledge base
        run: python scripts/validate_kb.py

      - name: Compile check
        run: python -m compileall -q src scripts

      # D4/D5：快测 + 覆盖率门槛；slow 标记（全语料遍历）留给 nightly
      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest -m "not slow" --cov=src --cov-report=term-missing --cov-fail-under=55 --tb=short 2>&1 | tee pytest.log

      # 把失败用例写进 check-run 注解：无需 Actions 登录也能从 API 看到失败详情
      - name: Annotate failing tests
        if: failure()
        run: |
          {
            echo "### pytest 失败用例（Python ${{ matrix.python-version }}）"
            echo '```'
            grep -E "^(FAILED|ERROR) " pytest.log | head -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR) " pytest.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          grep -E "^E  " pytest.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=pytest-detail::$line"
          done

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest.log

  # D6：指标回归报告（只在 main 上跑，产物可下载）
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Regenerate docs/metrics.md
        run: python scripts/eval_all.py
      - name: Fail if metrics report is stale
        run: git diff --exit-code docs/metrics.md
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: docs/metrics.md

