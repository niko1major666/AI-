[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skill-gap"
version = "0.1.0"
description = "AI 岗位技能差距分析系统：面向非科班求职者的技能抽取、语义匹配与差距诊断"
requires-python = ">=3.10,<3.13"
readme = "README.md"
# 依赖 canonical 清单见 requirements.txt（uv pip install -r），此处仅登记元数据避免漂移
dependencies = []

[project.optional-dependencies]
nlp = [
    "torch>=2.5,<3",
    "transformers>=4.57,<5",
    "sentence-transformers>=5.1,<6",
    "modelscope[framework]>=1.40",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
