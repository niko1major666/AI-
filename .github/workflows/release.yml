name: Release

# 推送 v* tag 时自动创建 GitHub Release（正文取 docs/release-notes/<tag>.md 的首行作标题）
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            TITLE=$(head -n 1 "$NOTES" | sed 's/^# //')
            tail -n +2 "$NOTES" > /tmp/notes.md
            gh release create "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --generate-notes
          fi
